<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#081018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CHOPPER HAUL '84</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #081018;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
      touch-action: none;
    }
    #game canvas {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #081018;
      color: #f4efe4;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      font-family: ui-monospace, "Cascadia Mono", "Menlo", "Consolas", monospace;
    }
    #rotate-overlay p {
      margin: 0;
      max-width: 18em;
      font-size: 26px;
      line-height: 1.35;
    }
    #rotate-overlay span {
      color: #ffb020;
      display: block;
      font-size: 32px;
      margin-bottom: 12px;
    }
    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-overlay { display: flex; }
    }
    #err-box {
      display: none;
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 99;
      background: #3a0d0d;
      color: #fff;
      font: 14px/1.35 monospace;
      padding: 8px 10px;
      border: 2px solid #ffb020;
      white-space: pre-wrap;
      max-height: 40vh;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-overlay">
    <p><span>ROTATE TO LANDSCAPE</span> Chopper Haul '84 flies sideways over the flood.</p>
  </div>
  <div id="err-box"></div>
  <script>
    (function () {
      var shown = 0;
      function show(msg) {
        var box = document.getElementById('err-box');
        if (!box || shown > 6) return;
        shown += 1;
        box.style.display = 'block';
        box.textContent += (box.textContent ? '\n' : 'Something broke.\n') + msg;
      }
      window.addEventListener('error', function (e) {
        show(String(e.message || e) + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('Promise: ' + String((e.reason && (e.reason.stack || e.reason.message)) || e.reason).slice(0, 300));
      });
    })();
  </script>
  <script src="lib/phaser.min.js?v=2"></script>
  <script type="module" src="js/main.js?v=2"></script>
</body>
</html>
